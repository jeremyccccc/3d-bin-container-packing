<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>装箱结果</title>
	<style>
		:root {
			--topbar-height: 56px;
			--sidebar-width: 240px;

			--footer-height: 0px;
			--surface: #fff;
			--canvas: #f5f6f7;
			--border: #d9dde3;
			--border-light: #e8eaed;
			--text: #1f2329;
			--muted: #646a73;
			--subtle: #8f959e;
			--accent: #1769e0;
			--accent-soft: #eaf2ff;
			--success: #2e7d32;

		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; color: var(--text); background: var(--canvas); font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; font-size: 13px; }

		.page-title { height: 34px; display: flex; align-items: center; gap: 8px; color: #245f96; font-size: 17px; font-weight: 700; white-space: nowrap; }
		.brand-mark { width: 34px; height: 34px; display: block; object-fit: contain; }
		.header-context { min-width: 0; height: 26px; display: flex; align-items: center; margin-left: 18px; padding-left: 18px; border-left: 1px solid rgba(151,183,215,.7); white-space: nowrap; }
		.header-master { max-width: min(42vw, 420px); overflow: hidden; color: #24364a; font-size: 12px; font-weight: 700; text-overflow: ellipsis; }

		.result-id { position: fixed; z-index: 7; right: 14px; bottom: 12px; max-width: calc(100vw - var(--sidebar-width) - 28px); color: #8a94a2; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
		.error { color: #b42318; }
		.panel { position: fixed; z-index: 6; top: var(--topbar-height); bottom: var(--footer-height); left: 0; width: var(--sidebar-width); overflow: auto; padding: 14px 12px 20px; background: #f7f9fc; border-right: 1px solid #dce3ec; scrollbar-width: thin; scrollbar-color: #c8d1dc transparent; }
		.list-section + .list-section { margin-top: 22px; }
		.section-header { min-height: 27px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 7px; }
		.section-title { margin: 0; color: #364152; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
		.section-count { min-width: 21px; height: 19px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; color: #687386; background: #e9eef5; border-radius: 10px; font-size: 10px; font-weight: 650; }
		.container-list { display: grid; gap: 7px; }
		.container-button { position: relative; width: 100%; min-height: 58px; display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; column-gap: 10px; padding: 8px 10px; color: var(--text); background: rgba(255,255,255,.9); border: 1px solid #e0e6ed; border-radius: 8px; box-shadow: 0 1px 2px rgba(31,42,55,.035); text-align: left; cursor: pointer; transition: border-color .16s ease, box-shadow .16s ease, background .16s ease, transform .16s ease; }
		.container-button:hover { background: #fff; border-color: #b9c8da; box-shadow: 0 4px 12px rgba(42,62,84,.08); transform: translateY(-1px); }
		.container-button.active { color: #165da8; background: #f2f7fd; border-color: #8eb9e6; box-shadow: 0 0 0 2px rgba(41,116,190,.09); }
		.container-index { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; color: #64748b; background: #eef2f6; border-radius: 7px; font-size: 10px; font-weight: 750; }
		.container-button.active .container-index { color: #fff; background: #397fbe; }
		.container-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
		.container-name { min-width: 0; font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.container-type { color: var(--subtle); font-size: 10px; font-weight: 500; }

		.legend { display: grid; grid-template-columns: 1fr; gap: 5px; }
		.badge { position: relative; min-width: 0; min-height: 62px; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 9px; padding: 9px 11px; color: #4b5563; background: rgba(255,255,255,.76); border: 1px solid transparent; border-radius: 9px; text-align: left; cursor: pointer; overflow: hidden; transition: border-color .16s ease, background .16s ease, box-shadow .16s ease, transform .16s ease; }
		.badge::before { width: 11px; height: 11px; background: var(--badge-color); border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgba(31,35,41,.13); content: ""; }
		.badge:hover { color: #253347; background: #fff; border-color: #d5dee8; box-shadow: 0 5px 14px rgba(42,62,84,.07); transform: translateY(-1px); }
		.badge.active { color: #155a9b; background: #fff; border-color: #9bc1e6; box-shadow: 0 0 0 2px rgba(41,116,190,.07); }
		.badge-copy { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
		.badge-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #202936; font-size: 11px; font-weight: 700; }
		.badge-summary { color: #98a1ad; font-size: 10px; font-weight: 500; white-space: nowrap; }
		.badge-count { color: #111827; font-size: 12px; font-weight: 750; white-space: nowrap; }
		.badge.active .badge-label { color: #155a9b; }
		.canvas-info { position: fixed; z-index: 7; top: calc(var(--topbar-height) + 14px); right: 16px; width: 430px; height: auto; color: #202936; background: rgba(255,255,255,.94); border: 1px solid rgba(218,225,233,.92); border-radius: 8px; box-shadow: 0 7px 22px rgba(36,50,66,.12); backdrop-filter: blur(8px); pointer-events: none; }
		.canvas-info-grid { padding: 13px 15px 14px; }
		.stats-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #edf0f3; }

		.stats-container-type { padding: 2px 7px; color: #5d6c7d; background: #f0f3f6; border-radius: 10px; font-size: 9px; font-weight: 650; }
		.stats-content { display: flex; align-items: center; gap: 14px; padding-top: 12px; }
		.stats-summary { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
		.stats-item { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 2px 9px; text-align: center; }
		.stats-item + .stats-item { border-left: 1px solid #edf0f3; }
		.stats-main { min-width: 0; display: flex; align-items: baseline; justify-content: center; gap: 2px; white-space: nowrap; }
		.stats-value { min-width: 0; color: #111827; font-size: 16px; font-weight: 760; line-height: 1; overflow: hidden; text-overflow: ellipsis; }
		.stats-unit { color: #8a94a2; font-size: 9px; font-weight: 600; }
		.stats-label { color: #7e8997; font-size: 9px; white-space: nowrap; }
		.utilization-block { flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
		.utilization-ring { position: relative; width: 50px; height: 50px; display: grid; place-items: center; border-radius: 50%; }
		.utilization-ring::after { position: absolute; inset: 5px; background: rgba(255,255,255,.98); border-radius: 50%; content: ""; }
		.utilization-ring-value { position: relative; z-index: 1; color: #17202c; font-size: 11px; font-weight: 760; }
		#viewer { position: fixed; inset: calc(var(--topbar-height) + var(--info-height)) 0 var(--footer-height) var(--sidebar-width); width: calc(100vw - var(--sidebar-width)); height: calc(100vh - var(--topbar-height) - var(--info-height) - var(--footer-height)); display: block; cursor: grab; outline: none; }
		#viewer:active { cursor: grabbing; }
		#viewer.cargo-hover { cursor: pointer; }
		.hover-tooltip { position: fixed; z-index: 12; max-width: 250px; padding: 7px 9px; color: #fff; background: rgba(31,35,41,.9); border-radius: 3px; box-shadow: 0 3px 10px rgba(31,35,41,.14); font-size: 11px; line-height: 1.45; pointer-events: none; transform: translate(12px, 12px); white-space: nowrap; }
		.hover-tooltip[hidden] { display: none; }
		.hover-tooltip strong { display: block; font-size: 12px; font-weight: 600; }
		.hover-tooltip span { color: rgba(255,255,255,.72); }
		.detail-panel { position: fixed; z-index: 4; width: 248px; max-width: calc(100vw - 20px); max-height: min(460px, calc(100vh - 40px)); overflow: auto; padding: 10px 12px 12px; background: rgba(255,255,255,.6); border: 1px solid rgba(207,213,220,.88); border-top: 3px solid var(--detail-color, var(--accent)); border-radius: 5px; box-shadow: 0 8px 22px rgba(31,35,41,.13), 0 2px 6px rgba(31,35,41,.06); backdrop-filter: blur(6px); }
		.detail-panel[hidden] { display: none; }
		.detail-grid { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 6px 10px; font-size: 11px; line-height: 1.45; }
		.detail-label { color: var(--muted); }
		.detail-value { color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
		@media (max-width: 760px) {
			:root { --topbar-height: 56px; --sidebar-width: 100vw; --info-height: 0px; }
			.topbar { padding: 7px 12px; }
			.page-title { height: 28px; font-size: 15px; }
			.brand-mark { width: 28px; height: 28px; }
			.header-context { flex: 1; margin-left: 12px; padding-left: 12px; }
			.header-master { max-width: calc(100vw - 120px); }
			.result-id { right: 8px; bottom: 8px; max-width: calc(100vw - 16px); }
			.panel { top: var(--topbar-height); bottom: auto; width: 100%; max-height: 32vh; padding: 10px; border-right: 0; border-bottom: 1px solid var(--border); }
			.canvas-info { top: calc(var(--topbar-height) + 32vh + 8px); right: 8px; left: 8px; width: auto; }
			#viewer { inset: calc(var(--topbar-height) + 32vh + var(--info-height)) 0 var(--footer-height) 0; width: 100vw; height: calc(100vh - var(--topbar-height) - 32vh - var(--info-height) - var(--footer-height)); }
			.detail-panel { width: min(248px, calc(100vw - 20px)); max-height: 46vh; }
		}
	</style>
	<script type="importmap">{"imports":{"three":"/webjars/three/0.181.1/build/three.module.min.js","three/addons/":"/webjars/three/0.181.1/examples/jsm/"}}</script>
</head>
<body>
	<header class="topbar">
		<div class="page-title"><img class="brand-mark" src="/packing-viewer-page/pstar-logo.png?v=2" alt="Pstar">Pstar</div>
		<div class="header-context">
			<strong id="masterTitle" class="header-master">—</strong>
		</div>
	</header>
	<div id="status" class="result-id">加载中...</div>
	<aside class="panel">
		<section class="list-section">
			<div class="section-header"><h2 class="section-title">货柜列表</h2><span id="containerListCount" class="section-count">0</span></div>
			<div id="containerList" class="container-list"></div>
		</section>
		<section class="list-section">
			<div class="section-header"><h2 class="section-title">分单列表</h2><span id="houseListCount" class="section-count">0</span></div>
			<div id="legend" class="legend"></div>
		</section>
	</aside>
	<section id="containerInfo" class="canvas-info" hidden>
		<div id="containerInfoBody" class="canvas-info-grid"></div>
	</section>
	<canvas id="viewer"></canvas>
	<div id="hoverTooltip" class="hover-tooltip" hidden></div>
	<aside id="detailPanel" class="detail-panel" hidden>
		<div id="detailBody" class="detail-grid"></div>
	</aside>
	<script type="module" src="/packing-viewer-page/viewer-three.js?v=20261014-17"></script>
</body>
</html>
